name: e2e

# The real collector on real desktops: trackd records two windows, is
# killed with no warning, starts again and recovers; then a scripted
# session with known true times is compared with what tock exported
# (the "accuracy:" line in the log and the job summary). See e2e/.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e-linux:
    strategy:
      fail-fast: false
      matrix:
        desktop: [openbox, i3, sway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: install the desktop
        run: |
          sudo apt-get update -qq
          case "${{ matrix.desktop }}" in
            openbox) sudo apt-get install -y -qq xvfb openbox xterm xdotool ;;
            i3) sudo apt-get install -y -qq xvfb i3-wm xterm xdotool ;;
            sway) sudo apt-get install -y -qq sway foot ;;
          esac
      - name: record, kill, recover; accuracy
        env:
          # a real 5.5 min idle stretch where X reports input idle
          E2E_IDLE: ${{ matrix.desktop == 'openbox' && '1' || '' }}
        run: |
          case "${{ matrix.desktop }}" in
            sway) scripts/e2e/sway.sh ;;
            *) scripts/e2e/x11.sh "${{ matrix.desktop }}" ;;
          esac

  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: record, kill, recover
        run: scripts/e2e/windows.ps1

  e2e-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: record, kill, recover; accuracy
        env:
          E2E_IDLE: "1"
        run: scripts/e2e/macos.sh

  # trackd's idle CPU and memory over a fixed window on a fresh install.
  perf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: install the desktop
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb openbox xterm
      - name: idle cpu and memory
        env:
          # A fresh install measured 14 MB footprint on macOS and 18 MB RSS
          # on Linux (2026-11-14). 30 MB catches a regression with room for
          # runner noise. A month of history adds more on a real Mac, so this
          # is not the 40 MB budget check; scripts/trackd-usage.sh is.
          PERF_MEM_MAX_MB: "30"
        run: scripts/e2e/perf.sh
